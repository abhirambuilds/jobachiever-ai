# ==============================================================================
# Test Profile (application-test.yml)
# Activated during automated JUnit 5 / Spring Boot testing
# Excludes live database connectivity so tests run fast without PostgreSQL
# ==============================================================================

spring:
  application:
    name: jobachiever-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

app:
  storage:
    resumes-dir: target/test-storage/resumes
    max-file-size-bytes: 10485760

logging:
  level:
    root: WARN
    ai.jobachiever: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
